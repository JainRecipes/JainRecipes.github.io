<header class="c-header">
  <div class="c-header__box">
    <div class="c-search">
      <div class="c-search__box">
        <label for="js-search-input" class="u-screen-reader-text">Search for Blog</label>
        <input type="text" id="js-search-input" class="c-search__text" autocomplete="off" placeholder="Type to search...">
        <div data-icon='ei-search' data-size='s'></div>
      </div>
      <ul id="js-results-container" class="c-search-results-list"></ul>
    </div>
    <div class="c-nav">
      <ul class="c-nav__list u-lists-reset">
        <li class="c-nav__item is-active">
          <div data-icon='ei-pencil' data-size='s'></div> Recipes</li>
        <li class="c-nav__item">
          <div data-icon='ei-star' data-size='s'></div> Categories</li>
      </ul>
    </div>
    <div class="c-header__actions">
    {% if page.url == '/' %}
    <button class="c-theme-toggle c-random-recipe" id="js-random-recipe" type="button" aria-label="Surprise me - random recipe" title="Random recipe">
      <svg class="c-theme-toggle__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect class="c-random-recipe__die" x="3" y="3" width="18" height="18" rx="4"></rect>
        <g class="c-random-recipe__pips">
          <circle cx="8.4" cy="8.4" r="1.5"></circle>
          <circle cx="15.6" cy="8.4" r="1.5"></circle>
          <circle cx="12" cy="12" r="1.5"></circle>
          <circle cx="8.4" cy="15.6" r="1.5"></circle>
          <circle cx="15.6" cy="15.6" r="1.5"></circle>
        </g>
      </svg>
    </button>
    {% endif %}
    <button class="c-theme-toggle" id="js-theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="c-theme-toggle__icon c-theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-3a1 1 0 0 0 1-1V1a1 1 0 1 0-2 0v2a1 1 0 0 0 1 1zm0 16a1 1 0 0 0-1 1v2a1 1 0 1 0 2 0v-2a1 1 0 0 0-1-1zM4.9 4.9a1 1 0 0 0-1.4 1.4l1.4 1.4A1 1 0 1 0 6.3 6.3zM19.1 4.9l-1.4 1.4a1 1 0 1 0 1.4 1.4l1.4-1.4a1 1 0 0 0-1.4-1.4zM4 12a1 1 0 0 0-1-1H1a1 1 0 1 0 0 2h2a1 1 0 0 0 1-1zm17-1h-2a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2zM6.3 17.7a1 1 0 0 0-1.4 0l-1.4 1.4a1 1 0 0 0 1.4 1.4l1.4-1.4a1 1 0 0 0 0-1.4zm12.8 0l-1.4-1.4a1 1 0 1 0-1.4 1.4l1.4 1.4a1 1 0 0 0 1.4-1.4z"></path>
      </svg>
      <svg class="c-theme-toggle__icon c-theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20.7 14.4A8.5 8.5 0 0 1 9.6 3.3 8.5 8.5 0 1 0 20.7 14.4z"></path>
      </svg>
    </button>
    </div>
  </div>
</header> <!-- /.c-header -->
