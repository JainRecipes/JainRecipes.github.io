version: 2
updates:
  # Testing Dependabot updates against both main and ai-improvements branches
  - package-ecosystem: "bundler"
    directory: "/" # Location of your Gemfile
    schedule:
      interval: "weekly" # Check for updates weekly
    commit-message:
      prefix: "fix" # Commit message prefix
      # Branch-specific commit configuration
    open-pull-requests-for: "all" # Open PRs for all branches
    target-branch: "master" # Primary target for Dependabot PRs

  # Additional update configuration for ai-improvements branch
  - package-ecosystem: "bundler"
    directory: "/" # Location of your Gemfile
    schedule:
      interval: "weekly" # Check for updates weekly
    commit-message:
      prefix: "fix" # Commit message prefix
    open-pull-requests-for: "all" # Open PRs for all branches
    target-branch: "ai-improvements" # Testing against ai-improvements branch
